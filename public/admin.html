<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Razy Tokens — Admin</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#08090d;color:#f7f7ff}*{box-sizing:border-box}body{margin:0;padding:32px 18px;background:radial-gradient(ellipse at 50% -20%,#33235b 0,transparent 55%),#08090d;min-height:100vh}.wrap{max-width:1100px;margin:auto}.panel{background:#11131b;border:1px solid #29283a;border-radius:16px;padding:22px;margin:16px 0}.login{max-width:420px;margin:10vh auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}h1{font-size:25px}h2{font-size:17px;margin-top:0}input,select,button{font:inherit;border-radius:8px;padding:11px;background:#1b1d29;color:white;border:1px solid #34364b;width:100%;margin:5px 0}button{background:#805dff;border:0;font-weight:700;cursor:pointer}button.secondary{background:#28283a}button.danger{background:#8b3448}.muted{color:#9698aa;font-size:13px}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.hidden{display:none!important}.user,.event{border-top:1px solid #292b3b;padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:13px}.pill{color:#c9b8ff}.status{min-height:18px;color:#ffc77a;font-size:13px;white-space:pre-wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#aaa;font-size:11px}
</style></head><body><main class="wrap">
<section id="login" class="panel login"><h1>RAZY / ADMIN</h1><p class="muted">Private administrator access.</p><input id="password" type="password" placeholder="Administrator password" autocomplete="current-password"><button id="login-btn">Sign in</button><div id="login-status" class="status"></div></section>
<section id="dashboard" class="hidden"><div class="row"><h1>RAZY TOKENS / CONTROL CENTER</h1><button class="secondary" id="logout">Sign out</button></div><p class="muted">Server-authorized controls. All changes are audited.</p>
<div class="grid"><div class="panel"><h2>Wallet management</h2><input id="player" placeholder="User ID (UUID)"><div class="row"><select id="mode"><option value="add">Add tokens</option><option value="remove">Remove tokens</option><option value="set">Set balance</option></select><input id="amount" type="number" min="0" max="10000000" placeholder="Amount"></div><button id="adjust">Apply balance change</button><div id="wallet-status" class="status"></div></div>
<div class="panel"><h2>Rename user</h2><input id="rename-player" placeholder="User ID (UUID)"><input id="rename-name" maxlength="20" placeholder="New username"><button id="rename">Save username</button><div id="rename-status" class="status"></div></div>
<div class="panel"><h2>Create live event</h2><select id="event-type"><option value="rain">Image rain</option><option value="announcement">Announcement</option><option value="banner">Special banner</option><option value="maintenance">Maintenance</option></select><input id="event-title" placeholder="Event title / announcement"><input id="event-image" type="url" placeholder="Image URL (HTTPS)"><input id="event-sound" type="url" placeholder="Optional sound URL (HTTPS)"><div class="row"><input id="event-count" type="number" min="1" max="35" value="14" placeholder="Images (1–35)"><input id="event-duration" type="number" min="1" max="1440" value="10" placeholder="Duration (minutes)"></div><button id="create-event">Start event</button><div id="event-status" class="status"></div></div></div>
<div class="panel"><div class="row"><h2>Users</h2><button class="secondary" id="refresh">Refresh data</button></div><div id="users" class="muted">Loading…</div></div>
<div class="panel"><h2>Active and recent events</h2><div id="events" class="muted"></div></div>
<div class="panel"><h2>Administrator audit log</h2><div id="audit" class="muted"></div></div>
</section></main>
<script>
const $=id=>document.getElementById(id);async function api(body){const r=await fetch('/api/public/admin',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)});return {status:r.status,data:await r.json().catch(()=>({}))}};
async function load(){const r=await fetch('/api/public/admin',{credentials:'same-origin',cache:'no-store'});if(!r.ok){$('dashboard').classList.add('hidden');$('login').classList.remove('hidden');return}const d=await r.json();$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('users').replaceChildren();for(const u of d.users||[]){const div=document.createElement('div');div.className='user';const label=document.createElement('span');label.textContent=`${u.user_profiles?.username||'Anonymous'} · ${Number(u.balance).toLocaleString()} RT · ${u.player_id}`;const copy=document.createElement('button');copy.className='secondary';copy.textContent='Use ID';copy.onclick=()=>{$('player').value=u.player_id;$('rename-player').value=u.player_id};div.append(label,copy);$('users').append(div)}$('events').replaceChildren();for(const e of d.events||[]){const row=document.createElement('div');row.className='event';const label=document.createElement('span');label.textContent=`${e.active?'ACTIVE':'ENDED'} · ${e.event_type} · ${e.title} · ${e.id}`;row.append(label);if(e.active){const stop=document.createElement('button');stop.className='danger';stop.textContent='Stop';stop.onclick=async()=>{const r=await api({action:'stop_event',event_id:e.id});if(r.data.ok)load()};row.append(stop)}$('events').append(row)}if(!(d.events||[]).length)$('events').textContent='No events';$('audit').textContent=(d.audit||[]).map(a=>`${a.created_at} · ${a.action} · ${a.target_player||''} · ${JSON.stringify(a.details)}`).join('\n')||'No actions recorded'}
$('login-btn').onclick=async()=>{const r=await api({action:'login',password:$('password').value});$('login-status').textContent=r.data.ok?'Signed in.':(r.data.error||'Login failed.');$('password').value='';if(r.data.ok)load()};
$('adjust').onclick=async()=>{const r=await api({action:'adjust_tokens',player_id:$('player').value,mode:$('mode').value,amount:Number($('amount').value)});$('wallet-status').textContent=r.data.ok?'Balance updated.':(r.data.error||'Failed.');if(r.data.ok)load()};
$('rename').onclick=async()=>{const r=await api({action:'rename_user',player_id:$('rename-player').value,username:$('rename-name').value});$('rename-status').textContent=r.data.ok?'Username updated.':(r.data.error||'Failed.');if(r.data.ok)load()};
$('create-event').onclick=async()=>{const r=await api({action:'create_event',event_type:$('event-type').value,title:$('event-title').value,image_url:$('event-image').value||null,sound_url:$('event-sound').value||null,count:Number($('event-count').value),duration_minutes:Number($('event-duration').value)});$('event-status').textContent=r.data.ok?'Event started.':(r.data.error||'Failed.');if(r.data.ok)load()};$('refresh').onclick=load;$('logout').onclick=async()=>{await api({action:'logout'});$('dashboard').classList.add('hidden');$('login').classList.remove('hidden')};load();
</script></body></html>
